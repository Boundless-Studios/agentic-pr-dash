[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-pr-dash"
version = "0.4.0"
description = "Watch your open PRs, detect what's blocking each (CI, review comments, conflicts), and let an agent resolve them — with a one-agent-per-PR ownership lease."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Boundless Studios" }]
keywords = ["github", "pull-request", "automation", "agents", "ci", "code-review"]

# Core install is intentionally lean: the maintenance executor (check/complete/
# arm/list-owned/loop) shells out to `gh` + `git` and needs almost nothing.
dependencies = [
    "pydantic>=2.0",
    # Pinned to an immutable commit (BOU-1812 CI fix): a mutable ``@main`` ref
    # makes CI non-reproducible and can silently adopt a breaking change. Bump
    # this sha deliberately, together with the call sites.
    #
    # ``d558062`` is agent-coordinator 0.2.0, which made ``lease_epoch`` a
    # REQUIRED kwarg on ``TaskCoordinator.heartbeat_claim`` / ``release_claim``
    # (fenced claims). Main briefly pinned back to ``8fa2034`` (0.1.0) because
    # our facade still called the old signature; this branch (BOU-2195) is that
    # deliberate adoption — ``coordinator.py`` now threads the lease epoch and
    # ``loop.py`` treats ``StaleClaimError`` as a per-PR handoff.
    "agent-coordinator @ git+https://github.com/Boundless-Studios/agent-coordinator.git@d558062de240937295c120c4f9ef0d1b1d7cb229",
]

[project.optional-dependencies]
# The web dashboard (`agentic-pr-dash serve`) pulls in the web stack.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Boundless-Studios/agentic-pr-dash"
Repository = "https://github.com/Boundless-Studios/agentic-pr-dash"

[project.scripts]
agentic-pr-dash = "agentic_pr_dash.cli:main"

[tool.hatch.build.targets.wheel]
# `packages` maps src/agentic_pr_dash -> agentic_pr_dash and includes ALL files
# under it (templates/ + static/ data files too) — no force-include needed; a
# force-include here would double-add those data files and break the wheel build.
packages = ["src/agentic_pr_dash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always test the checkout's src, never a previously installed snapshot of the
# package — a stale site-packages copy can silently win the import race and
# produce false greens (caught during BOU-1551 review).
pythonpath = ["src"]

[tool.hatch.metadata]
allow-direct-references = true
