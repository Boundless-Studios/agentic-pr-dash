[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-pr-dash"
version = "0.5.0"
description = "Watch your open PRs, detect what's blocking each (CI, review comments, conflicts), and let an agent resolve them — with a one-agent-per-PR ownership lease."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Boundless Studios" }]
keywords = ["github", "pull-request", "automation", "agents", "ci", "code-review"]

# Core install is intentionally lean: the maintenance executor (check/complete/
# arm/list-owned/loop) shells out to `gh` + `git` and needs almost nothing.
dependencies = [
    "pydantic>=2.0",
    # Provider-neutral review topology, finding normalization, and settlement.
    # Keep this immutable; downstream Gaia pins APD only after this reviewed
    # contract is available from a tagged release.
    "agent-review-coordinator @ git+https://github.com/Boundless-Studios/agent-review-coordinator.git@665fdb71b8dbe8140512ca113c021b7de263a9c4",
    # Pinned to an immutable commit (BOU-1812 CI fix): a mutable ``@main`` ref
    # makes CI non-reproducible and can silently adopt a breaking change. Bump
    # this sha deliberately, together with the call sites.
    #
    # ``9904b24`` is agent-coordinator 0.3.2 (BOU-2239). 0.2.0 made ``lease_epoch``
    # a REQUIRED kwarg on ``TaskCoordinator.heartbeat_claim`` / ``release_claim``
    # (fenced claims), which ``coordinator.py`` threads and ``loop.py`` treats as a
    # per-PR handoff via ``StaleClaimError``. 0.3.0 makes that fence actually bite:
    # heartbeat/release now compare against the TASK's current epoch rather than
    # the claim's own, and ``claim_task`` retires superseded claims in the same
    # transaction — so a stalled owner that resumes cannot re-arm its dead lease.
    #
    # Additive for us: ``StaleClaimError`` gains ``current_claim_id`` and the
    # claimed event gains ``superseded_claim_ids``; no signature we call changed.
    #
    # v0.4.0 (BOU-2039) added the durable human-decision
    # protocol this package's decision-wait path is built on —
    # ``request_decision`` / ``resolve_decision`` / ``decision_status`` /
    # ``pending_decisions`` / ``resume_task``, plus ``DecisionPendingError`` on a
    # terminal ``release_claim``. Also additive: every existing claim/lease
    # signature is unchanged, and a ledger written by 0.3.2 reads back cleanly
    # (no decision events -> no decisions).
    #
    # v0.5.0 (BOU-2710) adds the fenced local-command lease runner. The existing
    # claim and decision APIs remain additive and unchanged. Gaia, this package,
    # and agent-session-harness intentionally share this exact immutable tag
    # because uv cannot resolve two revisions of one git dependency.
    "agent-coordinator @ git+https://github.com/Boundless-Studios/agent-coordinator.git@v0.5.0",
]

[project.optional-dependencies]
# The web dashboard (`agentic-pr-dash serve`) pulls in the web stack.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Boundless-Studios/agentic-pr-dash"
Repository = "https://github.com/Boundless-Studios/agentic-pr-dash"

[project.scripts]
agentic-pr-dash = "agentic_pr_dash.cli:main"

[tool.hatch.build.targets.wheel]
# `packages` maps src/agentic_pr_dash -> agentic_pr_dash and includes ALL files
# under it (templates/ + static/ data files too) — no force-include needed; a
# force-include here would double-add those data files and break the wheel build.
packages = ["src/agentic_pr_dash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always test the checkout's src, never a previously installed snapshot of the
# package — a stale site-packages copy can silently win the import race and
# produce false greens (caught during BOU-1551 review).
pythonpath = ["src"]

[tool.hatch.metadata]
allow-direct-references = true
