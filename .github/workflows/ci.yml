name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Route trusted runs (push, and PRs from THIS repo) to the shared self-hosted
    # desktop fleet (Boundless-Studios `gaia-ci-desktop`) instead of billing GitHub
    # Actions minutes. PRs from forks stay on ubuntu-latest — untrusted code must
    # never run on our hardware. If the fleet is offline, wake it (or re-run on
    # ubuntu-latest); this light suite has no auto-probe fallback.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'gaia-ci-desktop' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall src/agentic_pr_dash
      - name: Test
        run: pytest -q
      - name: Build wheel (catches packaging/data-file regressions)
        run: |
          pip install build
          python -m build --wheel
          python - <<'PY'
          import glob, zipfile
          w = sorted(glob.glob('dist/agentic_pr_dash-*.whl'))[-1]
          names = zipfile.ZipFile(w).namelist()
          assert any(n.endswith('static/app.js') for n in names), 'static data missing from wheel'
          assert any(n.endswith('templates/dashboard.html') for n in names), 'templates missing from wheel'
          print('wheel OK:', w)
          PY
