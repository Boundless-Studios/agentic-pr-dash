name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall src/agentic_pr_dash
      - name: Test
        run: pytest -q
      - name: Build wheel (catches packaging/data-file regressions)
        run: |
          pip install build
          python -m build --wheel
          python - <<'PY'
          import glob, zipfile
          w = sorted(glob.glob('dist/agentic_pr_dash-*.whl'))[-1]
          names = zipfile.ZipFile(w).namelist()
          assert any(n.endswith('static/app.js') for n in names), 'static data missing from wheel'
          assert any(n.endswith('templates/dashboard.html') for n in names), 'templates missing from wheel'
          print('wheel OK:', w)
          PY
