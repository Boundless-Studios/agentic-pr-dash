# agentic-pr-dash configuration. Copy to `agentic-pr-dash.toml` at your repo root.
# Every value is optional and has a project-agnostic default. Any value can be
# overridden by a AGENTIC_PR_DASH_* environment variable (e.g. AGENTIC_PR_DASH_TRACKER).

[project]
# GitHub repo as "owner/name". Auto-detected from the git remote when omitted.
# repo = "octocat/hello-world"

# Where ownership markers and per-PR maintenance state are written.
state_dir = ".agentic-pr-dash"

# Task tracker for blocked PRs: "none" (default) | "beads" | "github-issues".
tracker = "none"

# Agent the loop dispatches fix prompts to. {prompt} is the injection point.
executor = "claude --dangerously-skip-permissions -p {prompt}"

# Process names treated as "a live agent" for ownership/liveness checks.
discovery_names = ["claude", "codex"]

# Self-hosted CI runner label to surface in the dashboard. Omit to hide the
# runner-fleet panel entirely (the default for projects on GitHub-hosted runners).
# runner_label = "my-ci-fleet"
# Docker name prefix for a fleet hosted on this machine/configured Docker daemon.
# When set, runner inventory is read locally without GitHub API credentials.
# local_runner_container_prefix = "gha-runner-"
# For a fleet on multiple Docker daemons, add one table per host. Each table
# requires prefix; docker_host is optional (omit it for the ambient daemon), and
# name is an optional display label. These tables override the legacy TOML key;
# AGENTIC_PR_DASH_LOCAL_RUNNER_CONTAINER_PREFIX overrides both TOML forms.
# [[project.local_runner_hosts]]
# name = "primary-ci"
# docker_host = "ssh://ci@example.com"
# prefix = "gha-runner-"
#
# [[project.local_runner_hosts]]
# name = "reserve"
# docker_host = "ssh://reserve@example.com"
# prefix = "gha-runner-"

# GitHub login whose open PRs the dashboard/maintenance tooling tracks.
# Default "@me" is right when gh runs as the human operator. REQUIRED when
# automation uses an isolated identity (a GitHub App installation token in
# GH_TOKEN): there "@me" is the App bot, which authored nothing, so the board
# goes silently empty and waiters see no PRs. Env: AGENTIC_PR_DASH_PR_AUTHOR.
# pr_author = "your-github-login"

# Ownership lease tuning (seconds).
lease_seconds = 1800
heartbeat_ttl_seconds = 600

# Optional: override the maintenance prompt wording (inline string or a file path).
# prompt_template = "docs/pr-fix-prompt.md"

# Optional: a session-event log the dashboard reads to show "agent working".
# session_registry_path = "~/.agentic-pr-dash/sessions/events.jsonl"
